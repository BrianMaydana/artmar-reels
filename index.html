<style>

:root{

}

select,input[type=number],input[type=text],input[type=tel]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}

.add{align-self:flex-start;background:transparent;border:1.5px dashed var(--muted);color:var(--ink);font:inherit;font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}

.sw{appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}

.days button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{padding:9px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.slots button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.how div{background:var(--bg);border-radius:16px;padding:14px;counter-increment:s}
.how div::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-weight:800;margin-bottom:6px}
.how b{display:block}.how small{color:var(--muted)}
ul.inc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 14px}
ul.inc li::before{content:"✓ ";color:var(--ok);font-weight:800}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--plum);color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
 padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dock small{color:#cfc6e6;font-size:12px;display:block}

.cta{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:13px 18px;white-space:nowrap}
.cta.sun{background:var(--sun);color:var(--sun-ink)}
.cta[aria-disabled="true"]{opacity:.45;pointer-events:none}
.msg{white-space:pre-wrap;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:14px;max-height:200px;overflow:auto}
.copy{align-self:flex-start;font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 14px;cursor:pointer}
.note{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px}
.fine{color:var(--muted);font-size:13px;margin:0}
.calc{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.calc .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gate{display:grid;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.gate b{font-size:16px}
.gate .err{color:#c2362b;font-size:13px;min-height:1em}
.locked{filter:blur(9px);user-select:none}
.unlock{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 18px;background:var(--wa);color:#fff;cursor:pointer;justify-self:start}
.unlock:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.calc .bar i{display:block;height:100%;width:0;background:var(--violet);transition:width .6s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  m:(o)=>`Hallo Artmar Malerei!\n\nIch möchte eine Besichtigung buchen.\n📅 Wunschtermin: ${o.when}\n\n${o.rooms}\nOptionen: ${o.opts}\nZustand: ${o.cond}\nRichtpreis laut Rechner: ${o.range}\n\nName: ${o.name}\nTel: ${o.tel}\nOrt: ${o.plz}\n${o.photos}`,
  mPhotos:n=>n?`📷 ${n} Fotos hänge ich hier an.`:'📷 Fotos schicke ich gleich.',withC:'mit Decken',noC:'ohne Decken',condV:['gut','normal (Dübellöcher)','viel Arbeit']},
 es:{h1:'Sube fotos, <em>precio en 30 s</em>',lead:'Sube fotos de tu piso, elige las habitaciones y ve al momento tu precio orientativo. Si te encaja, reservas la visita y allí te damos el precio fijo.',

  s3:'Tu precio orientativo',calc:'Calculado',pfine:'Precio orientativo con material, protección, encintado y limpieza incluidos. Sin IVA. El precio fijo y definitivo te lo damos en la visita, y después ya no cambia.',
  gT:'🔒 ¿A dónde te mandamos tu precio?',gS:'Pon tu nombre y tu móvil y verás tu precio al momento, y además te lo mandamos por WhatsApp. Gratis y sin compromiso.',tel:'Móvil',gBtn:'Ver mi precio',gErrN:'Escribe tu nombre.',gErrT:'Escribe un número de móvil válido.',lockedDock:'🔒 Pon tu número',

  s4:'Reserva la visita',s4h:'15 minutos en tu casa con nuestro pintor. Entre semana estamos en obra, así que las visitas las hacemos el sábado y el domingo. Elige día y hora y te lo confirmamos por WhatsApp.',name:'Nombre',plz:'Código postal / ciudad',
  photos0:'Aún no has elegido fotos. También puedes mandarlas directamente en el chat de WhatsApp.',photosN:n=>`📷 ${n} foto${n>1?'s':''} elegida${n>1?'s':''}. Adjúntalas en el chat de WhatsApp junto a este mensaje.`,
  send:'💬 Pedir cita',copy:'Copiar texto',copied:'Copiado',selected:'Texto marcado, cópialo ahora',pick:'Elige día y hora',
  how:'Cómo funciona',hw1:'Sube fotos',hw1s:'Una de cada pared.',hw2:'Precio en 30 s',hw2s:'Al momento, en esta página.',hw3:'Visita',hw3s:'El finde, 15 min en tu casa y precio fijo.',hw4:'Terminado el finde',hw4s:'Protegido, pintado, limpio.',
  inc:['Precio fijo que no sube','Material incluido','Suelos y muebles protegidos','Bordes encintados con cuidado','Trabajo con garantía','40× 5 estrellas (reseñas en España)'],
  dock:'Tu precio orientativo',dockBtn:'Reservar cita',walls:'Paredes',ceils:'Techos',cond:'Estado',prep:'% preparación',dark:'Cambio de color',darkV:'+1 mano',nic:'Imprimación aislante',incl:'incluida',furn:'Muebles y protección',doors:'Puertas',rads:'Radiadores',min:'Pedido mínimo',
  types:['Dormitorio','Habitación infantil','Salón','Cocina','Baño','Pasillo','Despacho','Otra habitación'],dow:['dom','lun','mar','mié','jue','vie','sáb'],ca:'aprox.',
  m:(o)=>`¡Hola Artmar Malerei!\n\nMe gustaría reservar una visita.\n📅 Fecha deseada: ${o.when}\n\n${o.rooms}\nOpciones: ${o.opts}\nEstado: ${o.cond}\nPrecio orientativo de la calculadora: ${o.range}\n\nNombre: ${o.name}\nTel: ${o.tel}\nLugar: ${o.plz}\n${o.photos}`,
  mPhotos:n=>n?`📷 Te adjunto ${n} fotos aquí.`:'📷 Ahora te mando las fotos.',withC:'con techos',noC:'sin techos',condV:['bien','normal (agujeros de tacos)','mucho trabajo']}
};
const AREAS=[14,11,24,10,6,8,11,12];
let lang='de'; try{const s=localStorage.getItem('artmar-lang'); if(s==='es'||s==='de') lang=s}catch(e){}
let rooms=[{t:0,a:14}], photos=[], day=null, slot=null, unlocked=false; const counts={doors:0,rads:0};
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n/10)*10).toLocaleString('de-CH');
const L=()=>TXT[lang];

function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>{const v=L()[e.dataset.i]; if(typeof v==='string') e.innerHTML=v});
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 $('inc').innerHTML=L().inc.map(x=>`<li>${x}</li>`).join('');
 drawRooms(); drawDays(); calc();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('artmar-lang',lang)}catch(e){};applyLang()});

// photos (kept in this browser only; the client attaches them in WhatsApp)
$('photos').addEventListener('change',e=>{[...e.target.files].slice(0,12-photos.length).forEach(f=>photos.push({name:f.name,url:URL.createObjectURL(f)}));e.target.value='';drawThumbs();calc()});
const drop=document.querySelector('.drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault()}));
drop.addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).slice(0,12-photos.length).forEach(f=>photos.push({name:f.name,url:URL.createObjectURL(f)}));drawThumbs();calc()});
function drawThumbs(){$('thumbs').innerHTML='';photos.forEach((p,i)=>{const f=document.createElement('figure');const im=document.createElement('img');im.src=p.url;im.alt=p.name;const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Foto entfernen');b.onclick=()=>{URL.revokeObjectURL(p.url);photos.splice(i,1);drawThumbs();calc()};f.append(im,b);$('thumbs').appendChild(f)})}

function drawRooms(){
 const box=$('rooms'); box.innerHTML='';
 rooms.forEach((r,i)=>{
  const row=document.createElement('div'); row.className='room';
  const sel=document.createElement('select'); sel.id='rt'+i; sel.setAttribute('aria-label',L().s2+' '+(i+1));
  L().types.forEach((n,k)=>{const o=document.createElement('option');o.value=k;o.textContent=n;if(k===r.t)o.selected=true;sel.appendChild(o)});
  sel.onchange=()=>{r.t=+sel.value;r.a=AREAS[r.t];drawRooms();calc()};
  const w=document.createElement('div'); w.className='m2';
  const inp=document.createElement('input'); inp.type='number'; inp.min=2; inp.max=200; inp.value=r.a; inp.id='ra'+i; inp.inputMode='numeric'; inp.setAttribute('aria-label','m²');
  inp.oninput=()=>{r.a=Math.max(0,+inp.value||0);calc()};
  w.appendChild(inp);
  const del=document.createElement('button'); del.type='button'; del.className='icon-btn'; del.textContent='×'; del.setAttribute('aria-label','−');
  del.disabled=rooms.length===1; del.style.opacity=rooms.length===1?.35:1; del.onclick=()=>{rooms.splice(i,1);drawRooms();calc()};
  row.append(sel,w,del); box.appendChild(row);
 });
}
$('addRoom').onclick=()=>{rooms.push({t:0,a:14});drawRooms();calc()};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;counts[k]=Math.max(0,Math.min(20,counts[k]+ +b.dataset.d));$(k).textContent=counts[k];calc()});
document.querySelectorAll('main input,main select').forEach(e=>e.addEventListener('change',calc));
['name','tel','plz'].forEach(id=>$(id).addEventListener('input',calc));

function nextDays(){const out=[];const d=new Date();d.setHours(0,0,0,0);for(let i=1;out.length<8&&i<40;i++){const x=new Date(d);x.setDate(d.getDate()+i);const w=x.getDay();const s=w===0?VISIT.sun:w===6?VISIT.sat:VISIT.weekday;if(s.length)out.push({date:x,slots:s})}return out}
let DAYS=nextDays();
function drawDays(){
 const box=$('days');box.innerHTML='';
 DAYS.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',day===i);
  b.innerHTML=`<small>${L().dow[d.date.getDay()]}</small><b>${d.date.getDate()}.</b><small>${d.date.toLocaleDateString(lang==='de'?'de-CH':'es-ES',{month:'short'})}</small>`;
  b.onclick=()=>{day=i;slot=null;drawDays();calc()};box.appendChild(b)});
 const sb=$('slots');sb.innerHTML='';
 if(day!==null) DAYS[day].slots.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.setAttribute('aria-pressed',slot===s);b.onclick=()=>{slot=s;drawDays();calc()};sb.appendChild(b)});
}

let lastKey='', LAST={};
const telOk=v=>{const d=v.replace(/[^0-9+]/g,'');const n=d.replace(/^\+/,'');return /^\+?[0-9]{9,15}$/.test(d)&&!/^0{3}/.test(n)};
function calc(){
 const T=L();
 const h=+document.querySelector('input[name=h]:checked').value;
 const condV=+document.querySelector('input[name=cond]:checked').value;
 const ceilOn=$('ceil').checked,dark=$('dark').checked,nic=$('nic').checked,furn=$('furn').checked;
 let wall=0,ceil=0; rooms.forEach(r=>{const a=r.a||0;wall+=4*Math.sqrt(a)*h*0.88;if(ceilOn)ceil+=a});
 const base=wall*RATE_WALL+ceil*RATE_CEIL;
 let est=base*(1+condV+(dark?0.25:0)+(nic?0.3:0)+(furn?0.1:0))+counts.doors*DOOR+counts.rads*RAD;
 const minApplied=est<MIN_JOB; est=Math.max(est,MIN_JOB);
 const range='CHF '+fmt(est*LOW)+' – '+fmt(est*HIGH);
 $('rangeBig').textContent=range; $('rangeBig').classList.toggle('locked',!unlocked);
 $('range').textContent=unlocked?range:T.lockedDock; $('gate').hidden=unlocked;
 document.querySelector('.dock .cta').setAttribute('href',unlocked?'#book':'#priceCard');
 const key=range; if(key!==lastKey){lastKey=key;const b=$('bar');b.style.transition='none';b.style.width='0';requestAnimationFrame(()=>{b.style.transition='';b.style.width='100%'})}
 const lines=[[T.walls,Math.round(wall)+' m²'],...(ceilOn?[[T.ceils,Math.round(ceil)+' m²']]:[]),...(condV?[[T.cond,'+'+Math.round(condV*100)+' '+T.prep]]:[]),
  ...(dark?[[T.dark,T.darkV]]:[]),...(nic?[[T.nic,T.incl]]:[]),...(furn?[[T.furn,T.incl]]:[]),...(counts.doors?[[T.doors,counts.doors+' ×']]:[]),...(counts.rads?[[T.rads,counts.rads+' ×']]:[]),...(minApplied?[[T.min,'CHF '+fmt(MIN_JOB)]]:[])];
 $('break').innerHTML=lines.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join('');
 $('photoNote').textContent=photos.length?T.photosN(photos.length):T.photos0;
 const when=(day!==null&&slot)?`${T.dow[DAYS[day].date.getDay()]} ${DAYS[day].date.toLocaleDateString(lang==='de'?'de-CH':'es-ES',{day:'numeric',month:'long'})}, ${slot}`:'…';
 const opts=[ceilOn?T.withC:T.noC,dark&&T.dark,nic&&T.nic,furn&&T.furn,counts.doors&&counts.doors+' '+T.doors,counts.rads&&counts.rads+' '+T.rads].filter(Boolean).join(', ');
 const m=T.m({when,rooms:rooms.map(r=>`• ${T.types[r.t]}, ${T.ca} ${r.a} m²`).join('\n'),opts,cond:T.condV[[0,0.15,0.35].indexOf(condV)]+', '+(h===3.2?'> 2.8':h)+' m',range,name:$('name').value||'…',tel:$('tel').value||'…',plz:$('plz').value||'…',photos:T.mPhotos(photos.length)});
 $('msg').textContent=m;
 const ok=unlocked&&day!==null&&slot;
 LAST={range,rooms:rooms.map(r=>`• ${T.types[r.t]}, ${T.ca} ${r.a} m²`).join('\n'),opts};
 const a=$('wa2'); a.textContent=ok?T.send:T.pick; a.setAttribute('aria-disabled',!ok);
 a.href=(WHATSAPP?'https://wa.me/'+WHATSAPP:'https://wa.me/')+'?text='+encodeURIComponent(m);
 $('waNum').textContent=WHATSAPP?'WhatsApp: +'+WHATSAPP:'';
}
$('unlock').onclick=()=>{const T=L();const n=$('name').value.trim(),t=$('tel').value.trim();
 if(!n){$('gErr').textContent=T.gErrN;$('name').focus();return}
 if(!telOk(t)){$('gErr').textContent=T.gErrT;$('tel').focus();return}
 $('gErr').textContent='';unlocked=true;calc();
 const m=T.lead2({...LAST,name:n,tel:t});
 window.open((WHATSAPP?'https://wa.me/'+WHATSAPP:'https://wa.me/')+'?text='+encodeURIComponent(m),'_blank','noopener');
 $('priceCard').scrollIntoView({behavior:'smooth',block:'start'})};
$('copy').onclick=async()=>{const T=L();try{await navigator.clipboard.writeText($('msg').textContent);$('copy').textContent=T.copied}catch(e){const r=document.createRange();r.selectNodeContents($('msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copy').textContent=T.selected}setTimeout(()=>$('copy').textContent=T.copy,2500)};
applyLang();
</script>

</body></html>
