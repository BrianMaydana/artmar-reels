<title>Artmar Preisrechner</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a painter's job sheet: photos, rooms, price, appointment; live price docked at the bottom */
:root{
 --bg:#f3f5f9; --card:#ffffff; --ink:#102143; --muted:#5d6b85; --line:#dfe4ee;
 --plum:#102143; --sun:#fec945; --sun-ink:#102143; --ok:#15803d; --wa:#1fa855; --violet:#2b5797;
 --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
 --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0b1730; --card:#14254a; --ink:#eef2fa; --muted:#9fb0cc; --line:#22365e;
 --plum:#081124; --ok:#4ade80; --wa:#25d366; --violet:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0b1730; --card:#14254a; --ink:#eef2fa; --muted:#9fb0cc; --line:#22365e;
 --plum:#081124; --ok:#4ade80; --wa:#25d366; --violet:#7aa2ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.hero{background:var(--plum);color:#fff;border-radius:0 0 28px 28px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:24px max(20px,env(safe-area-inset-left,0px)) 26px}
.hero-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1}
.brand small{display:block;color:var(--sun);font-weight:700;letter-spacing:5px;font-size:12px;margin-top:3px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:6px 12px;background:transparent;color:#fff;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;letter-spacing:-1px;margin:6px 0 0;text-wrap:balance}
.hero h1 em{font-style:normal;background:var(--sun);color:var(--sun-ink);padding:0 8px;border-radius:10px}
.hero p{margin:0;color:#d3dbea;max-width:52ch}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;font-weight:700}
.flow span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px}
.flow i{font-style:normal;color:var(--sun)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:baseline;gap:10px}
.step span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-weight:800;font-size:14px;flex:none}
.step h2{font-family:var(--display);font-size:21px;margin:0;font-weight:800;letter-spacing:-.3px}
.hint{color:var(--muted);font-size:14px;margin:-6px 0 0}
.drop{border:2px dashed var(--muted);border-radius:16px;padding:18px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--bg)}
.drop b{font-size:16px}.drop small{color:var(--muted)}
.drop:focus-within{outline:3px solid var(--sun)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.room{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;align-items:center}
select,textarea,input[type=number],input[type=text],input[type=tel]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.m2{position:relative}.m2 input{padding-right:34px;text-align:right;font-variant-numeric:tabular-nums}
.m2::after{content:"m²";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.icon-btn{width:40px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.add{align-self:flex-start;background:transparent;border:1.5px dashed var(--muted);color:var(--ink);font:inherit;font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.seg label{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;background:var(--bg)}
.seg label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{font-weight:700}.seg small{color:var(--muted);font-size:13px}
.seg.two{grid-template-columns:1fr 1fr}
textarea{resize:vertical;min-height:84px;line-height:1.4}
.arearow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.arearow label{font-weight:700}
.arearow .m2{width:130px}
.teaser{margin:0 0 10px;font-weight:800;font-size:18px}
.teaser:empty{display:none}
.colq{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.colq .t b{display:block;font-size:16px}.colq .t small{color:var(--muted);font-size:13px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.toggle .t{min-width:0}.toggle .t small{display:block;color:var(--muted);font-size:13px}
.sw{appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(20px)}
.count{display:flex;align-items:center;gap:6px;flex:none}
.count button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.count output{width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.price{display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.break{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.break div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.break div span:first-child{color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.days button,.slots button{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;cursor:pointer}
.days button{flex:none;width:66px;padding:8px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.days button small{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.days button b{font-size:22px;font-family:var(--display)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.days button[aria-pressed="true"] small{color:var(--sun)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{padding:9px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.slots button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.how div{background:var(--bg);border-radius:16px;padding:14px;counter-increment:s}
.how div::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-weight:800;margin-bottom:6px}
.how b{display:block}.how small{color:var(--muted)}
ul.inc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 14px}
ul.inc li::before{content:"✓ ";color:var(--ok);font-weight:800}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--plum);color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
 padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.dock .cta{flex:none;white-space:nowrap;padding:12px 16px;font-size:15px}
.dock .range{font-size:clamp(18px,5.4vw,26px)!important}
.dock small{color:#c3cde0;font-size:12px;display:block}
.dock .range{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.5vw,32px);letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:13px 18px;white-space:nowrap}
.cta.sun{background:var(--sun);color:var(--sun-ink)}
.cta[aria-disabled="true"]{opacity:.45;pointer-events:none}
.msg{white-space:pre-wrap;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:14px;max-height:200px;overflow:auto}
.copy{align-self:flex-start;font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 14px;cursor:pointer}
.note{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px}
.fine{color:var(--muted);font-size:13px;margin:0}
.calc{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.calc .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gate{display:grid;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.gate b{font-size:16px}
.gate .err{color:#c2362b;font-size:13px;min-height:1em}
.locked{filter:blur(9px);user-select:none}
.next{margin:12px 0 0;font-weight:800;color:var(--ink)}
.unlock{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 18px;background:var(--wa);color:#fff;cursor:pointer;justify-self:start}
.unlock:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.calc .bar i{display:block;height:100%;width:0;background:var(--violet);transition:width .6s ease}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.why div{background:var(--bg);border-radius:16px;padding:14px}
.why b{display:block;font-family:var(--display);font-size:16px}.why small{color:var(--muted);font-size:14px;line-height:1.4;display:block;margin-top:2px}
.why span{font-size:24px;line-height:1;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:var(--plum);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.faq details{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px}
.faq details+details{margin-top:8px}
.faq summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--muted);flex:none}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 13px;color:var(--muted);font-size:15px}
.rv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.stars{color:#f5b301;letter-spacing:1px}
.rv{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.rv article{flex:0 0 84%;max-width:330px;scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rv .who{display:flex;gap:10px;align-items:center}
.rv .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.rv .who b{display:block;line-height:1.2}.rv .who small{color:var(--muted);font-size:12px}
.rv p{margin:0;font-size:14.5px;line-height:1.45}
.rv details{font-size:13px;color:var(--muted)}.rv details summary{cursor:pointer;font-weight:600}.rv details p{font-size:13px;margin-top:4px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

];
const AREAS=[0,0,14,11,24,10,6,8,11,12];
let lang='de'; try{const s=localStorage.getItem('artmar-lang'); if(s==='es'||s==='de') lang=s}catch(e){}
let rooms=[{t:0,a:0}], photos=[], day=null, slot=null, unlocked=false; const counts={doors:0,rads:0};
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n/10)*10).toLocaleString('de-CH');
const L=()=>TXT[lang];

// lead log (Google Sheet via Apps Script): visit / calc / unlock / book
const LOG_URL="https://script.google.com/macros/s/AKfycbz2lSCSD24gw2-rhU6shPzHgexH8dbfNNljDtRSUd_KpIfv5UyQkLpM2eqxCP1ZvywH/exec";
let SID='';try{SID=localStorage.getItem('artmar-sid')||'';if(!SID){SID=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);localStorage.setItem('artmar-sid',SID)}}catch(e){SID=Math.random().toString(36).slice(2,10)}
const SRC=(()=>{try{const q=new URLSearchParams(location.search);if(q.get('gclid'))return 'google-ads';if(q.get('utm_source'))return q.get('utm_source');if(document.referrer)return new URL(document.referrer).hostname;}catch(e){}return 'direkt'})();
function track(ev,x){try{const body=JSON.stringify(Object.assign({ev,sid:SID,src:SRC,lang},x||{}));if(navigator.sendBeacon){navigator.sendBeacon(LOG_URL,new Blob([body],{type:'text/plain'}))}else{fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body,keepalive:true})}}catch(e){}}

function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>{const v=L()[e.dataset.i]; if(typeof v==='string') e.innerHTML=v});
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 $('inc').innerHTML=L().inc.map(x=>`<li>${x}</li>`).join('');
 $('why').innerHTML=L().why.map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('');
 $('chips').innerHTML=L().areas.map(x=>`<span>${x}</span>`).join('');
 $('faq').innerHTML=L().faq.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');
 $('rv').innerHTML=REVIEWS.map(r=>{const t=r[lang]||r.de,show=r.o!==lang;return `<article><div class="who"><span class="av" style="background:${r.c}">${r.n[0]}</span><div><b>${r.n}</b><small>${L().rvTag} · <span class="stars">★★★★★</span></small></div></div><p>${t}</p>${show?`<details><summary>${L().rvOrig} (${L().rvLang[r.o]})</summary><p lang="${r.o}">${r.orig}</p></details>`:''}</article>`}).join('');
 drawDays(); calc();
 document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=L()[e.dataset.ph]});
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('artmar-lang',lang)}catch(e){};applyLang()});

// photos (kept in this browser only; the client attaches them in WhatsApp)
$('photos').addEventListener('change',e=>{[...e.target.files].slice(0,12-photos.length).forEach(f=>photos.push({name:f.name,url:URL.createObjectURL(f)}));e.target.value='';drawThumbs();calc()});
const drop=document.querySelector('.drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault()}));
drop.addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).slice(0,12-photos.length).forEach(f=>photos.push({name:f.name,url:URL.createObjectURL(f)}));drawThumbs();calc()});
function drawThumbs(){$('thumbs').innerHTML='';photos.forEach((p,i)=>{const f=document.createElement('figure');const im=document.createElement('img');im.src=p.url;im.alt=p.name;const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Foto entfernen');b.onclick=()=>{URL.revokeObjectURL(p.url);photos.splice(i,1);drawThumbs();calc()};f.append(im,b);$('thumbs').appendChild(f)})}

function parseArea(t){
 let m=t.match(/(\d{1,3}(?:[.,]\d+)?)\s*(?:m\s*2|m²|m\^2|qm|quadrat|metros?|mt2)/i);
 if(m)return Math.round(parseFloat(m[1].replace(',','.')));
 m=t.match(/(\d(?:[.,]\d)?)\s*[- ]?(?:zimmer|zi\b|habitaci|hab\b|dorm|pi[eè]ces|rooms?)/i);
 if(m)return Math.round(parseFloat(m[1].replace(',','.'))*21);
 return 0}
let areaManual=false;
$('desc').addEventListener('input',()=>{if(!areaManual){const a=parseArea($('desc').value);$('area').value=a||''}calc()});
$('area').addEventListener('input',()=>{areaManual=$('area').value!=='';calc()});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;counts[k]=Math.max(0,Math.min(20,counts[k]+ +b.dataset.d));$(k).textContent=counts[k];calc()});
document.querySelectorAll('main input,main select').forEach(e=>e.addEventListener('change',calc));
['name','tel','plz'].forEach(id=>$(id).addEventListener('input',calc));

function nextDays(){const out=[];const d=new Date();d.setHours(0,0,0,0);for(let i=1;out.length<8&&i<40;i++){const x=new Date(d);x.setDate(d.getDate()+i);const w=x.getDay();const s=w===0?VISIT.sun:w===6?VISIT.sat:VISIT.weekday;if(s.length)out.push({date:x,slots:s})}return out}
let DAYS=nextDays();
function drawDays(){
 const box=$('days');box.innerHTML='';
 DAYS.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',day===i);
  b.innerHTML=`<small>${L().dow[d.date.getDay()]}</small><b>${d.date.getDate()}.</b><small>${d.date.toLocaleDateString(lang==='de'?'de-CH':'es-ES',{month:'short'})}</small>`;
  b.onclick=()=>{day=i;slot=null;drawDays();calc()};box.appendChild(b)});
 const sb=$('slots');sb.innerHTML='';
 if(day!==null) DAYS[day].slots.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.setAttribute('aria-pressed',slot===s);b.onclick=()=>{slot=s;drawDays();calc()};sb.appendChild(b)});
}

let lastKey='', LAST={};
const telOk=v=>{const d=v.replace(/[^0-9+]/g,'');const n=d.replace(/^\+/,'');return /^\+?[0-9]{9,15}$/.test(d)&&!/^0{3}/.test(n)};
function calc(){
 const T=L();
 const h=2.5;
 const condV=0.15;
 const area=Math.min(400,Math.max(0,Math.round(+$('area').value||0)));rooms=[{t:0,a:area}];
 const ceilOn=true,dark=document.querySelector('input[name=col]:checked').value==='1',nic=false,furn=document.querySelector('input[name=furn]:checked').value==='1';
 let wall=0,ceil=0; const floor=rooms.reduce((x,r)=>x+(r.a||0),0); rooms.forEach(r=>{const a=r.a||0;wall+=r.t<2?a*2.2*(h/2.5):4*Math.sqrt(a)*h*0.88;if(ceilOn)ceil+=a});
 const base=wall*RATE_WALL+ceil*RATE_CEIL;
 let est=base*(1+condV+(dark?0.25:0)+(nic?0.3:0)+(furn?0.1:0))+counts.doors*DOOR+counts.rads*RAD;
 const minApplied=est<MIN_JOB; est=Math.max(est,MIN_JOB);
 const range='CHF '+fmt(est*LOW)+' – '+fmt(est*HIGH);
 $('rangeBig').textContent=range; $('rangeBig').classList.toggle('locked',!unlocked);
 $('range').textContent=unlocked?range:T.lockedDock; $('dockCta').textContent=unlocked?T.dockBtn:T.dockLocked;
 $('teaser').textContent=(!unlocked&&area>0)?T.teaser('CHF '+fmt(est*LOW)):''; $('areaHint').textContent=area>0?T.areaOk(area):T.areaNo;
 const roomsTxt=($('desc').value.trim().slice(0,300)||T.types[0])+' ('+T.ca+' '+area+' m²)'; $('gate').hidden=unlocked; $('nextHint').hidden=!unlocked;
 document.querySelector('.dock .cta').setAttribute('href',unlocked?'#book':'#priceCard');
 const key=range; if(key!==lastKey){lastKey=key;const b=$('bar');b.style.transition='none';b.style.width='0';requestAnimationFrame(()=>{b.style.transition='';b.style.width='100%'})}
 const lines=[[T.walls,Math.round(wall)+' m²'],...(ceilOn?[[T.ceils,Math.round(ceil)+' m²']]:[]),
  ...(dark?[[T.dark,T.darkV]]:[]),...(nic?[[T.nic,T.incl]]:[]),...(furn?[[T.furn,T.incl]]:[]),...(counts.doors?[[T.doors,counts.doors+' ×']]:[]),...(counts.rads?[[T.rads,counts.rads+' ×']]:[]),...(minApplied?[[T.min,'CHF '+fmt(MIN_JOB)]]:[]),[T.dur,T.durV(floor)]];
 $('break').innerHTML=lines.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join('');
 $('photoNote').textContent=photos.length?T.photosN(photos.length):T.photos0;
 const when=(day!==null&&slot)?`${T.dow[DAYS[day].date.getDay()]} ${DAYS[day].date.toLocaleDateString(lang==='de'?'de-CH':'es-ES',{day:'numeric',month:'long'})}, ${slot}`:'…';
 const opts=[T.dur+': '+T.durV(floor),ceilOn?T.withC:T.noC,dark&&T.dark,nic&&T.nic,furn&&T.furn,counts.doors&&counts.doors+' '+T.doors,counts.rads&&counts.rads+' '+T.rads].filter(Boolean).join(', ');
 const m=T.m({when,rooms:roomsTxt,opts,cond:T.condV[[0,0.15,0.35].indexOf(condV)],range,name:$('name').value||'…',tel:$('tel').value||'…',plz:$('plz').value||'…',photos:T.mPhotos(photos.length)});
 $('msg').textContent=m;
 const ok=unlocked&&day!==null&&slot;
 LAST={range,rooms:roomsTxt,opts};
 const a=$('wa2'); a.textContent=ok?T.send:T.pick; a.setAttribute('aria-disabled',!ok);
 a.href=(WHATSAPP?'https://wa.me/'+WHATSAPP:'https://wa.me/')+'?text='+encodeURIComponent(m);
 $('waNum').textContent=WHATSAPP?'WhatsApp: +'+WHATSAPP:'';
}
$('unlock').onclick=()=>{const T=L();const n=$('name').value.trim(),t=$('tel').value.trim();
 if(!(+$('area').value>0)){$('gErr').textContent=T.gErrA;$('area').focus();return}
 if(!telOk(t)){$('gErr').textContent=T.gErrT;$('tel').focus();return}
 $('gErr').textContent='';unlocked=true;calc();trackLead();
 track('unlock',{name:n,tel:t,plz:$('plz').value.trim(),range:LAST.range,det:LAST.rooms+'\n'+LAST.opts});
 $('priceCard').scrollIntoView({behavior:'smooth',block:'start'})};
$('copy').onclick=async()=>{const T=L();try{await navigator.clipboard.writeText($('msg').textContent);$('copy').textContent=T.copied}catch(e){const r=document.createRange();r.selectNodeContents($('msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copy').textContent=T.selected}setTimeout(()=>$('copy').textContent=T.copy,2500)};
applyLang();
track('visit');
let _calcSent=false;document.querySelector('main').addEventListener('input',()=>{if(!_calcSent){_calcSent=true;track('calc',{range:LAST.range})}});
document.querySelector('main').addEventListener('change',()=>{if(!_calcSent){_calcSent=true;track('calc',{range:LAST.range})}});
$('wa2').addEventListener('click',()=>{if($('wa2').getAttribute('aria-disabled')==='false'){try{if(window.fbq)fbq('track','Schedule');}catch(e){}track('book',{name:$('name').value.trim(),tel:$('tel').value.trim(),plz:$('plz').value.trim(),range:LAST.range,when:(day!==null&&slot)?`${DAYS[day].date.toLocaleDateString('de-CH')} ${slot}`:'',det:LAST.rooms+'\n'+LAST.opts})}});
</script>

</body></html>
